; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; `pio run` builds the firmware; `pio test -e native` runs the host tests for
; the pure modules under lib/ (Button, Sounds, Protocol, Link).
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; The game page is served from LittleFS (`data/`, filled by `npm run build` in
; web/); `pio run -t uploadfs` writes it to flash.
board_build.filesystem = littlefs

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    links2004/WebSockets@^2.6.1

; TFT_eSPI is configured here rather than through its User_Setup.h so the panel
; wiring sits next to the build. Pins mirror docs/hardware.md; read its panel
; notes for why this part needs care.
;
; ST7735_GREENTAB160x80 carries the panel's 26-column window offset and inverts
; for IPS. If the image sits a couple of pixels off, the alternate tab is
; ST7735_REDTAB160x80 (24-column offset) plus -DTFT_INVERSION_ON, since that
; tab does not invert on its own. TFT_MISO is omitted: the panel is write-only.
;
; The backlight on GPIO25 is driven by StatusBoard over LEDC, so TFT_BL is
; deliberately not defined and TFT_eSPI leaves that pin alone.
build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7735_DRIVER
    -DTFT_WIDTH=80
    -DTFT_HEIGHT=160
    -DST7735_GREENTAB160x80
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=17
    -DTFT_DC=16
    -DTFT_RST=4
    -DSPI_FREQUENCY=27000000
    -DLOAD_GLCD
    -DLOAD_FONT2

; Host tests for the pure modules. build_src_filter drops src/ (which pulls in
; Arduino and TFT_eSPI); the lib/ modules under test are compiled normally.
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
